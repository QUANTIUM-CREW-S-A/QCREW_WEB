services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - vite_env
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 y no localhost: dentro del contenedor localhost resuelve a ::1
      # primero y nginx sólo escucha en IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

secrets:
  vite_env:
    file: .env
