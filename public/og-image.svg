  <text x="176" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#EDEFF2">Quantium<tspan fill="#2FA8D8">Crew</tspan></text>
  <text x="176" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="4" fill="#8FA0AF">INFRAESTRUCTURA TI · PANAMÁ</text>

  <text x="80" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="74" font-weight="700" fill="#EDEFF2">Del cableado</text>
  <text x="80" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="74" font-weight="700" fill="#EDEFF2">a la nube.</text>

  <text x="80" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#9CA9B6">Diseñamos, construimos y gestionamos tu infraestructura tecnológica.</text>
  <text x="80" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#9CA9B6">Un solo contrato, respuesta en menos de 24 h.</text>

